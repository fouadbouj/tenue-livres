# Déploie automatiquement les fonctions serveur dans Supabase à chaque modification.
# Secret GitHub requis : SUPABASE_ACCESS_TOKEN (Supabase > Account > Access Tokens).
name: Déployer les fonctions Supabase
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/fonctions-supabase.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJET: dluizzekoukuwskokyfz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Outil Supabase
        run: npx --yes supabase@latest --version
      - name: Assistant IA (clé Anthropic gardée sur le serveur, connexion requise)
        run: npx --yes supabase@latest functions deploy ai --project-ref "$PROJET" --use-api --yes
      - name: Guides de l'équipe (membres connectés seulement)
        run: npx --yes supabase@latest functions deploy guide --project-ref "$PROJET" --use-api --yes
      - name: Envoi de courriels depuis l'intranet (connexion requise)
        run: npx --yes supabase@latest functions deploy tl-email --project-ref "$PROJET" --use-api --yes
      # cc-avis et cc-rappels vérifient elles-mêmes l'appelant (membre connecté, client du portail ou secret des tâches programmées)
      - name: Avis du portail client
        run: npx --yes supabase@latest functions deploy cc-avis --project-ref "$PROJET" --no-verify-jwt --use-api --yes
      - name: Rappels et sommaire mensuel
        run: npx --yes supabase@latest functions deploy cc-rappels --project-ref "$PROJET" --no-verify-jwt --use-api --yes
      # cc-paiement : page de paiement publique (payer.html) et webhook Stripe signé
      - name: Paiement des factures
        run: npx --yes supabase@latest functions deploy cc-paiement --project-ref "$PROJET" --no-verify-jwt --use-api --yes
