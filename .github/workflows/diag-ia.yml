# Diagnostic temporaire de la fonction IA (à supprimer)
name: Diagnostic IA
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJET: dluizzekoukuwskokyfz
    steps:
      - name: Test
        run: |
          set +e
          curl -s -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" https://api.supabase.com/v1/projects/$PROJET/functions | jq -r '.[] | "\(.slug) \(.name) \(.status) v\(.version)"'
          echo "== OPTIONS"; curl -s -o /dev/null -w "%{http_code}\n" -X OPTIONS https://$PROJET.supabase.co/functions/v1/ai -H "Origin: https://app.boujradcpa.com" -H "Access-Control-Request-Method: POST"
          echo "== POST sans connexion"; curl -s -m 60 -w "\nHTTP %{http_code}\n" -X POST https://$PROJET.supabase.co/functions/v1/ai -H "Content-Type: application/json" -d '{"prompt":"test"}'
