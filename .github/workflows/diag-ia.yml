# Diagnostic temporaire de la fonction IA (à supprimer)
name: Diagnostic IA
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJET: dluizzekoukuwskokyfz
    steps:
      - name: Fonctions déployées
        run: |
          curl -s -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" https://api.supabase.com/v1/projects/$PROJET/functions | jq -r '.[] | "\(.slug) \(.status) v\(.version) jwt=\(.verify_jwt) maj=\(.updated_at)"'
      - name: Secrets et super-processor
        run: |
          curl -s -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" https://api.supabase.com/v1/projects/$PROJET/secrets | jq -r '.[].name'
          echo "== super-processor"; curl -s -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" https://api.supabase.com/v1/projects/$PROJET/functions/super-processor | jq 'del(.ezbr_sha256)'
          curl -s -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" https://api.supabase.com/v1/projects/$PROJET/functions/super-processor/body -o body.bin; file body.bin; strings body.bin | grep -iE "anthropic|tl_membres|Deno.serve|modelTier|tier|max_tokens|claude-" | head -20
