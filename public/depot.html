<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dépôt de documents · Boujrad CPA Inc.</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="espace.css">
<meta name="robots" content="noindex">
</head>
<body>
<header class="top"><div class="in"><a class="brand" href="https://boujradcpa.com"><img src="favicon.svg" alt=""> Boujrad CPA Inc. <span>Dépôt sécurisé</span></a></div></header>
<main>
  <div class="card" id="box"><p class="sub">Chargement…</p></div>
</main>
<footer>Boujrad CPA Inc. · 220-672, boulevard des Laurentides, Laval (Québec) H7G 2V9 · Les fichiers sont transmis de façon chiffrée et conservés dans un espace privé.</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(()=>{const cfg=window.CONFIG||{},sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY,{auth:{persistSession:false}});
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const jeton=new URLSearchParams(location.search).get('j')||'';let SENT=[];
const fn=async body=>{const{data,error}=await sb.functions.invoke(cfg.FONCTION_DEPOT||'cc-depot',{body:{jeton,...body}});if(error){let m=error.message;try{m=(await error.context.json()).error||m}catch(e){}throw new Error(m)}return data};
const d=x=>new Date(x+'T12:00').toLocaleDateString('fr-CA',{day:'numeric',month:'long',year:'numeric'});
(async()=>{let I;try{I=await fn({action:'info'})}catch(e){$('box').innerHTML=`<h1>Lien invalide</h1><p>Ce lien de dépôt n’est plus valide. Communiquez avec Boujrad CPA pour en recevoir un nouveau.</p>`;return}
  $('box').innerHTML=`<h1>${esc(I.client)}</h1><p class="sub">Documents pour vos déclarations de TPS et de TVQ, période du ${d(I.debut)} au ${d(I.fin)}${I.echeance?` · date limite de production : ${d(I.echeance)}`:''}.</p>
  ${I.statut==='reçue'||I.statut==='apportée au bureau'?`<div class="info">Nous avons déjà reçu des documents pour cette période. Vous pouvez en ajouter si vous en avez oublié.</div>`:''}
  <h3>À transmettre</h3><p>${esc(I.documents)}</p>
  <div class="alert"><strong>Déposez tous vos documents de la période en une seule fois.</strong>Nous préparons vos déclarations à partir de ce que vous déposez ici.</div>
  <div class="drop" id="drop" style="margin-top:14px"><p style="margin:0 0 10px"><strong>Glissez vos fichiers ici</strong> ou</p><input type="file" id="files" multiple accept=".pdf,.jpg,.jpeg,.png,.heic,.heif,.webp,.csv,.xlsx,.xls,.doc,.docx,.txt,.ofx,.qbo,.zip" style="max-width:340px;margin:auto"><p class="sub" style="margin:8px 0 0;font-size:13px">PDF, photos, Excel ou CSV · 25 Mo au maximum par fichier</p></div>
  <ul id="fl"></ul><div class="msg" id="m"></div>
  <div class="row" style="margin-top:12px"><button class="pri" id="fin" disabled>J’ai terminé : envoyer au cabinet</button></div>`;
  const up=async L=>{const m=$('m');m.className='msg';for(const f of L){if(f.size>26214400){m.textContent=f.name+' : trop gros (25 Mo au maximum).';m.className='msg err';continue}
      m.textContent='Envoi de '+f.name+'…';try{const u=await fn({action:'url',nom:f.name,taille:f.size});const{error}=await sb.storage.from('documents').uploadToSignedUrl(u.path,u.token,f,{contentType:f.type||undefined});if(error)throw error;
        SENT.push({path:u.path,nom:f.name,taille:f.size});$('fl').insertAdjacentHTML('beforeend',`<li>${esc(f.name)}</li>`)}catch(e){m.textContent=f.name+' : '+e.message;m.className='msg err'}}
    if(SENT.length&&m.className!=='msg err')m.textContent=SENT.length+' document(s) prêt(s). Cliquez sur « J’ai terminé » quand tout est déposé.';$('fin').disabled=!SENT.length};
  $('files').onchange=e=>{up([...e.target.files]);e.target.value=''};
  const dr=$('drop');dr.ondragover=e=>{e.preventDefault();dr.classList.add('over')};dr.ondragleave=()=>dr.classList.remove('over');dr.ondrop=e=>{e.preventDefault();dr.classList.remove('over');up([...e.dataTransfer.files])};
  $('fin').onclick=async()=>{$('fin').disabled=true;try{const r=await fn({action:'fini',fichiers:SENT});$('box').innerHTML=`<h1>Merci!</h1><p>${r.nb} document(s) bien reçu(s) par Boujrad CPA Inc. Nous communiquerons avec vous si un renseignement manque.</p>`}catch(e){$('m').textContent='Envoi impossible : '+e.message;$('m').className='msg err';$('fin').disabled=false}}})()})();
</script>
</body>
</html>
